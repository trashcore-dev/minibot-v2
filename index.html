<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TelexWA — Bot Servers</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06080d;
      --surface: #0c0f16;
      --surface2: #121620;
      --border: #1a1f2e;
      --accent: #00ff9d;
      --accent2: #00c8ff;
      --warn: #ffb347;
      --danger: #ff4d6d;
      --text: #dde4f0;
      --muted: #3d4a5c;
      --muted2: #222a38;
      --online: #00ff9d;
      --offline: #ff4d6d;
      --checking: #ffb347;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0,255,157,.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,200,255,.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,255,157,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,157,.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    /* ── HEADER ── */
    .page-header { text-align: center; margin-bottom: 2rem; }
    .page-eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--accent);
      letter-spacing: .2em; text-transform: uppercase; margin-bottom: .75rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .page-eyebrow::before, .page-eyebrow::after { content: ''; width: 32px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); }
    .page-eyebrow::after { transform: scaleX(-1); }
    .page-title { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -.04em; line-height: 1.05; margin-bottom: .75rem; }
    .page-title em { font-style: normal; color: var(--accent); }
    .page-sub { font-size: .9rem; color: var(--muted); max-width: 420px; margin: 0 auto; line-height: 1.7; font-weight: 400; }

    /* ── AUTH BAR / CARD ── */
    #authArea { margin-bottom: 2rem; }

    .signedin-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: .8rem 1.1rem;
    }
    .signedin-who { display: flex; align-items: center; gap: .6rem; font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--text); }
    .signedin-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); flex-shrink: 0; }
    .signedin-who b { color: var(--accent); font-weight: 600; }
    .logout-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: .68rem; letter-spacing: .05em;
      padding: .45rem .9rem; border-radius: 20px; cursor: pointer; transition: all .2s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    .auth-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; max-width: 420px; margin: 0 auto;
    }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .auth-tab {
      flex: 1; text-align: center; padding: .9rem; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); background: transparent; border: none; transition: all .2s;
    }
    .auth-tab.active { color: var(--accent); background: rgba(0,255,157,.05); box-shadow: inset 0 -2px 0 var(--accent); }
    .auth-body { padding: 1.25rem; }
    .auth-field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .9rem; }
    .auth-field label { font-family: 'JetBrains Mono', monospace; font-size: .65rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .auth-field input {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
      padding: .8rem .9rem; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: .95rem;
      outline: none; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none;
    }
    .auth-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,157,.12); }
    .auth-submit {
      width: 100%; padding: .85rem; border-radius: 10px; border: none; cursor: pointer;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: .92rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #06080d;
      display: flex; align-items: center; justify-content: center; gap: .5rem; transition: all .2s;
    }
    .auth-submit:hover:not(:disabled) { box-shadow: 0 0 20px rgba(0,255,157,.25); }
    .auth-submit:disabled { opacity: .5; cursor: not-allowed; }
    .auth-error {
      display: none; font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--danger);
      background: rgba(255,77,109,.08); border: 1px solid rgba(255,77,109,.2); border-radius: 8px;
      padding: .6rem .8rem; margin-bottom: .9rem; line-height: 1.5;
    }
    .auth-hint { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); margin-top: .85rem; line-height: 1.6; }
    .spinner-sm { width: 14px; height: 14px; border: 2px solid rgba(6,8,13,.35); border-top-color: #06080d; border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CARDS GRID ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 2rem; }

    .server-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; position: relative; transition: transform .2s, border-color .2s, box-shadow .2s;
      animation: fadeUp .5s ease both;
    }
    .server-card:nth-child(1) { animation-delay: .05s; }
    .server-card:nth-child(2) { animation-delay: .15s; }
    .server-card:nth-child(3) { animation-delay: .25s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .server-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    .server-card.online { border-color: rgba(0,255,157,.2); }
    .server-card.online:hover { border-color: rgba(0,255,157,.4); box-shadow: 0 12px 40px rgba(0,255,157,.08); }
    .server-card.offline { border-color: rgba(255,77,109,.15); }
    .server-card.offline:hover { border-color: rgba(255,77,109,.3); }
    .server-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0; transition: opacity .3s;
    }
    .server-card.online::before { opacity: 1; }
    .server-card.offline::before { background: linear-gradient(90deg, transparent, var(--danger), transparent); opacity: .6; }

    .card-top { padding: 1.25rem 1.25rem 1rem; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .server-name { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; margin-bottom: .2rem; }
    .server-url { font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

    .status-badge { display: flex; align-items: center; gap: .35rem; font-family: 'JetBrains Mono', monospace; font-size: .62rem; letter-spacing: .08em; padding: .28rem .7rem; border-radius: 20px; flex-shrink: 0; }
    .status-badge.online { background: rgba(0,255,157,.1); border: 1px solid rgba(0,255,157,.25); color: var(--online); }
    .status-badge.offline { background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.25); color: var(--offline); }
    .status-badge.checking { background: rgba(255,179,71,.08); border: 1px solid rgba(255,179,71,.2); color: var(--checking); }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .online .badge-dot { background: var(--online); box-shadow: 0 0 5px var(--online); animation: blink 2s infinite; }
    .offline .badge-dot { background: var(--offline); }
    .checking .badge-dot { background: var(--checking); animation: blink .8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .card-stats { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: .7rem; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; }
    .stat-key { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: .4rem; }
    .stat-key svg { opacity: .5; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--text); font-weight: 500; }
    .stat-val.accent { color: var(--accent); }
    .stat-val.loading { width: 64px; height: 12px; background: var(--surface2); border-radius: 4px; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0%,100% { opacity: .4; } 50% { opacity: .9; } }

    .session-bar-wrap { padding: 0 1.25rem .1rem; }
    .session-bar-track { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .session-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .8s ease; min-width: 2px; }
    .session-bar-fill.warn { background: linear-gradient(90deg, var(--warn), var(--danger)); }

    .card-footer { padding: .9rem 1.25rem; border-top: 1px solid var(--border); }
    .open-btn {
      display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; padding: .7rem 1rem;
      background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--muted);
      font-family: 'Syne', sans-serif; font-size: .82rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: all .2s; letter-spacing: .02em;
    }
    .open-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,255,157,.05); }
    .open-btn svg { transition: transform .2s; }
    .open-btn:hover svg { transform: translateX(3px); }
    .server-card.online .open-btn:hover { box-shadow: 0 0 16px rgba(0,255,157,.15); }

    /* ── PER-CARD: connect + your sessions ── */
    .card-mine { border-top: 1px solid var(--border); }
    .card-mine-header {
      padding: .8rem 1.25rem .5rem; font-family: 'JetBrains Mono', monospace; font-size: .65rem;
      color: var(--muted); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: .5rem;
    }
    .card-mine-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
    .card-mine-body { padding: 0 1.25rem 1.1rem; display: flex; flex-direction: column; gap: .6rem; }

    .locked-note { padding: .95rem 1.25rem; font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border); }

    .connect-row { display: flex; gap: .5rem; }
    .connect-row input {
      flex: 1; min-width: 0; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
      padding: .6rem .7rem; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: .82rem; outline: none;
    }
    .connect-row input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(0,200,255,.12); }
    .connect-row button {
      flex-shrink: 0; background: var(--accent-dim, rgba(0,200,255,.1)); border: 1px solid rgba(0,200,255,.3); color: var(--accent2);
      font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 600; padding: 0 .9rem; border-radius: 8px; cursor: pointer; transition: all .2s;
    }
    .connect-row button:hover:not(:disabled) { background: rgba(0,200,255,.18); }
    .connect-row button:disabled { opacity: .5; cursor: not-allowed; }

    .mini-msg { font-family: 'JetBrains Mono', monospace; font-size: .68rem; padding: .5rem .7rem; border-radius: 8px; display: none; line-height: 1.5; }
    .mini-msg.ok { background: rgba(0,255,157,.08); color: var(--accent); border: 1px solid rgba(0,255,157,.2); display: block; }
    .mini-msg.err { background: rgba(255,77,109,.08); color: var(--danger); border: 1px solid rgba(255,77,109,.2); display: block; }

    .pair-code-box { text-align: center; background: var(--bg); border: 1.5px dashed rgba(0,200,255,.35); border-radius: 10px; padding: .8rem; }
    .pair-code-val { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; letter-spacing: .18em; color: var(--accent2); margin-bottom: .3rem; }
    .pair-code-hint { font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--muted); }

    .mine-list { display: flex; flex-direction: column; gap: .45rem; }
    .mine-item { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .55rem .7rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; }
    .mine-item-num { font-family: 'JetBrains Mono', monospace; font-size: .78rem; }
    .mine-item-del { flex-shrink: 0; background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.25); color: var(--danger); font-family: 'JetBrains Mono', monospace; font-size: .65rem; padding: .35rem .6rem; border-radius: 6px; cursor: pointer; transition: all .2s; }
    .mine-item-del:hover:not(:disabled) { background: rgba(255,77,109,.2); }
    .mine-item-del:disabled { opacity: .5; cursor: not-allowed; }
    .mine-empty { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); text-align: center; padding: .5rem 0; }

    /* ── REFRESH BAR ── */
    .locked-hero { display:none; background: var(--surface); border: 1px dashed var(--muted2); border-radius: 16px; padding: 1.6rem 1.2rem; text-align:center; color: var(--muted); font-size: .85rem; line-height:1.7; }
    .admin-panel { background: var(--surface); border: 1px solid var(--accent2); border-radius: 16px; margin-top: 1.5rem; overflow: hidden; }
    .admin-head { display:flex; align-items:center; gap:.5rem; padding:.85rem 1.1rem; border-bottom:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color: var(--accent2); }
    .admin-body { padding: 1rem 1.1rem; }
    .admin-sub { font-family:'JetBrains Mono',monospace; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color: var(--muted); margin:.9rem 0 .5rem; }
    .admin-row { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; background: var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.55rem .75rem; margin-bottom:.45rem; }
    .admin-row b { font-family:'JetBrains Mono',monospace; font-weight:500; font-size:.8rem; }
    .admin-row small { color: var(--muted); font-family:'JetBrains Mono',monospace; font-size:.62rem; }
    .admin-row .grow { flex:1; }
    .admin-btn { cursor:pointer; background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.3rem .55rem; font-size:.68rem; font-family:'Syne',sans-serif; }
    .admin-btn.danger { border-color: var(--danger); color: var(--danger); }
    .admin-tag { font-family:'JetBrains Mono',monospace; font-size:.55rem; letter-spacing:.1em; color: var(--accent2); border:1px solid var(--accent2); border-radius:6px; padding:.08rem .3rem; }
    .admin-empty { color: var(--muted); font-size:.75rem; padding:.5rem 0; }
    .refresh-row { display: flex; align-items: center; justify-content: center; gap: .75rem; margin-top: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); }
    .refresh-btn { display: flex; align-items: center; gap: .4rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: .35rem .9rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: .65rem; cursor: pointer; transition: all .2s; }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-btn.spinning svg { animation: spin .7s linear infinite; }

    .page-footer { text-align: center; margin-top: 3rem; font-family: 'JetBrains Mono', monospace; font-size: .65rem; color: var(--muted); letter-spacing: .05em; }

    @media (max-width: 480px) {
      .wrap { padding: 2rem 1rem 3rem; }
      .page-title { font-size: 1.9rem; }
      .cards { grid-template-columns: 1fr; }
    }

    /* ── MUSIC PLAYER ── */
    .music-player { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; position: relative; margin-bottom: 2rem; animation: fadeUp .5s ease both; animation-delay: .35s; }
    .music-player::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent); }
    .player-inner { padding: 1.2rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .player-art { width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; position: relative; overflow: hidden; }
    .player-art.playing { animation: rotateSlow 8s linear infinite; }
    @keyframes rotateSlow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    .player-info { flex: 1; min-width: 0; }
    .player-title { font-size: .92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .2rem; }
    .player-track-sub { font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
    .player-live-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); flex-shrink: 0; display: none; }
    .player-live-dot.active { display: block; animation: blink 1.5s infinite; }
    .player-controls { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    .ctrl-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; flex-shrink: 0; }
    .ctrl-btn:active { transform: scale(.9); }
    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,255,157,.07); }
    .ctrl-btn.play-btn { width: 46px; height: 46px; background: linear-gradient(135deg, var(--accent2), var(--accent)); border: none; color: #06080d; }
    .ctrl-btn.play-btn:hover { box-shadow: 0 0 20px rgba(0,255,157,.35); transform: scale(1.05); }
    .player-progress-wrap { padding: 0 1.25rem .3rem; }
    .player-time-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--muted); margin-bottom: .35rem; }
    .progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; cursor: pointer; position: relative; }
    .progress-track:hover { height: 6px; margin-top: -1px; }
    .progress-fill-music { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 2px; width: 0%; transition: width .5s linear; pointer-events: none; }
    .player-tracks { border-top: 1px solid var(--border); padding: .6rem .75rem; display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; }
    .player-tracks::-webkit-scrollbar { display: none; }
    .track-pill { flex-shrink: 0; padding: .35rem .85rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap; }
    .track-pill:hover { border-color: var(--accent2); color: var(--accent2); }
    .track-pill.active { background: rgba(0,200,255,.1); border-color: var(--accent2); color: var(--accent2); }
    .waveform { display: flex; align-items: center; gap: 2px; height: 18px; }
    .wave-bar { width: 3px; background: var(--accent); border-radius: 2px; opacity: .5; height: 4px; transition: height .1s; }
    .playing .wave-bar { animation: waveDance .6s ease-in-out infinite; opacity: 1; }
    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: .1s; }
    .wave-bar:nth-child(3) { animation-delay: .2s; }
    .wave-bar:nth-child(4) { animation-delay: .15s; }
    .wave-bar:nth-child(5) { animation-delay: .05s; }
    @keyframes waveDance { 0%,100% { height: 4px; } 50% { height: 16px; } }
  </style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <div class="page-eyebrow">Live Status</div>
    <h1 class="page-title">Bot <em>Servers</em></h1>
    <p class="page-sub">Sign in to connect and manage your own WhatsApp sessions across every TelexWA bot instance.</p>
  </div>

  <div id="authArea"></div>

  <div class="locked-hero" id="lockedHero">
    🔒 Sign in above to see the bot servers, generate pairing codes and manage your sessions.
  </div>

  <div class="cards" id="cardsContainer"></div>

  <div id="adminArea"></div>

  <!-- MUSIC PLAYER -->
  <div class="music-player" id="musicPlayer">
    <div class="player-inner">
      <div class="player-art" id="playerArt">🎵</div>
      <div class="player-info">
        <div class="player-title" id="trackTitle">Select a track</div>
        <div class="player-track-sub">
          <div class="player-live-dot" id="liveDot"></div>
          <div class="waveform" id="waveform">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
          <span id="trackSub">TelexWA Radio</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" id="prevBtn" onclick="prevTrack()" title="Previous">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" onclick="nextTrack()" title="Next">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <div class="player-progress-wrap">
      <div class="player-time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
      <div class="progress-track" id="progressTrack" onclick="seekTo(event)">
        <div class="progress-fill-music" id="musicProgress"></div>
      </div>
    </div>

    <div class="player-tracks" id="trackList"></div>
  </div>

  <div class="refresh-row" id="refreshRow">
    <span id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Refresh
    </button>
  </div>

  <div class="page-footer">TelexWA &nbsp;·&nbsp; Powered by @trashcore/baileys</div>
</div>

<div id="toast">✓ Done</div>
<style>
  #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(100px); background:var(--surface2); border:1px solid var(--border); border-radius:24px; padding:.65rem 1.2rem; font-family:'JetBrains Mono',monospace; font-size:.78rem; color:var(--online); box-shadow:0 8px 32px rgba(0,0,0,.4); z-index:999; transition:transform .3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; }
  #toast.show { transform:translateX(-50%) translateY(0); }
</style>

<script>
  // ── CONFIGURE YOUR SERVERS HERE ──────────────────────────────────────────
  const SERVERS = [
    { name: 'Server One',   url: 'https://worker1.drextrash.online' },
    { name: 'Server Two',   url: 'https://drexst-93ff65c6ac8b.herokuapp.com' },
    { name: 'Server Three', url: 'https://drexs-8557076913b3.herokuapp.com' },
  ];
  // Any one server handles /api/register and /api/login as long as every
  // server shares the same DATABASE_URL and JWT_SECRET — the token you get
  // back from this one is valid on all of them. Defaults to the first server.
  const AUTH_SERVER = SERVERS[0].url;
  // ─────────────────────────────────────────────────────────────────────────

  // ══════════════════════════ AUTH STATE ═════════════════════════════════
  let authToken = localStorage.getItem('twa_token') || null;
  let authUser  = JSON.parse(localStorage.getItem('twa_user') || 'null');

  function authHeaders() {
    return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
  }

  function setAuth(token, user) {
    authToken = token; authUser = user;
    localStorage.setItem('twa_token', token);
    localStorage.setItem('twa_user', JSON.stringify(user));
    renderAuthArea();
    buildAllCards();
    refreshAll();
  }

  function clearAuth() {
    authToken = null; authUser = null;
    localStorage.removeItem('twa_token');
    localStorage.removeItem('twa_user');
    renderAuthArea();
    buildAllCards();
    refreshAll();
  }

  let authTab = 'login';

  function renderAuthArea() {
    const el = document.getElementById('authArea');
    if (authToken && authUser) {
      el.innerHTML = `
        <div class="signedin-bar">
          <div class="signedin-who"><div class="signedin-dot"></div>Signed in as <b>${escapeHtml(authUser.username)}</b></div>
          <button class="logout-btn" onclick="doLogout()">Log out</button>
        </div>
      `;
      return;
    }
    el.innerHTML = `
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${authTab==='login'?'active':''}" onclick="switchAuthTab('login')">Sign In</button>
          <button class="auth-tab ${authTab==='signup'?'active':''}" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>
        <div class="auth-body">
          <div class="auth-error" id="authError"></div>
          ${authTab === 'login' ? `
            <div class="auth-field"><label>Username or Email</label><input id="loginId" autocomplete="username" /></div>
            <div class="auth-field"><label>Password</label><input id="loginPw" type="password" autocomplete="current-password" /></div>
            <button class="auth-submit" id="authSubmitBtn" onclick="doLogin()">Sign In</button>
            <div class="auth-hint">New here? Switch to Sign Up above.</div>
          ` : `
            <div class="auth-field"><label>Username</label><input id="signupUser" autocomplete="username" placeholder="letters, numbers, underscore" /></div>
            <div class="auth-field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" /></div>
            <div class="auth-field"><label>Password</label><input id="signupPw" type="password" autocomplete="new-password" placeholder="min 8 characters" /></div>
            <button class="auth-submit" id="authSubmitBtn" onclick="doSignup()">Create Account</button>
            <div class="auth-hint">Already have an account? Switch to Sign In above.</div>
          `}
        </div>
      </div>
    `;
    const enterHandler = e => { if (e.key === 'Enter') (authTab === 'login' ? doLogin() : doSignup()); };
    el.querySelectorAll('input').forEach(i => i.addEventListener('keydown', enterHandler));
  }

  function switchAuthTab(tab) { authTab = tab; renderAuthArea(); }

  function showAuthError(msg) {
    const e = document.getElementById('authError');
    e.textContent = msg; e.style.display = 'block';
  }

  async function doLogin() {
    const username = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPw').value;
    const btn = document.getElementById('authSubmitBtn');
    if (!username || !password) return showAuthError('Enter your username/email and password.');
    btn.disabled = true; btn.innerHTML = '<div class="spinner-sm"></div> Signing in…';
    try {
      const res = await fetch(AUTH_SERVER + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (!res.ok) { showAuthError(data.error || 'Login failed.'); btn.disabled = false; btn.textContent = 'Sign In'; return; }
      setAuth(data.token, data.user);
      showToast('✓ Signed in');
    } catch (e) { showAuthError('Server error — try again.'); btn.disabled = false; btn.textContent = 'Sign In'; }
  }

  async function doSignup() {
    const username = document.getElementById('signupUser').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPw').value;
    const btn = document.getElementById('authSubmitBtn');
    if (!username || !email || !password) return showAuthError('Fill in every field.');
    btn.disabled = true; btn.innerHTML = '<div class="spinner-sm"></div> Creating account…';
    try {
      const res = await fetch(AUTH_SERVER + '/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password }) });
      const data = await res.json();
      if (!res.ok) { showAuthError(data.error || 'Registration failed.'); btn.disabled = false; btn.textContent = 'Create Account'; return; }
      setAuth(data.token, data.user);
      showToast('✓ Account created');
    } catch (e) { showAuthError('Server error — try again.'); btn.disabled = false; btn.textContent = 'Create Account'; }
  }

  function doLogout() { clearAuth(); showToast('Signed out'); }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ══════════════════════════ STATUS + SESSIONS ═══════════════════════════
  function formatUptime(secs) {
    if (!secs && secs !== 0) return '—';
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }
  function formatSessionUptime(ts) {
    if (!ts) return 'connected';
    const secs = Math.floor((Date.now() - ts) / 1000);
    if (secs < 60) return secs + 's uptime';
    if (secs < 3600) return Math.floor(secs/60) + 'm uptime';
    return Math.floor(secs/3600) + 'h ' + Math.floor((secs%3600)/60) + 'm uptime';
  }

  function buildCard(server, index) {
    const mineSection = authToken ? `
      <div class="card-mine">
        <div class="card-mine-header"><div class="dot"></div>Connect a number</div>
        <div class="card-mine-body">
          <div class="connect-row">
            <input type="tel" id="connectPhone-${index}" placeholder="254712345678" inputmode="numeric" pattern="[0-9]*" maxlength="20" />
            <button id="connectBtn-${index}" onclick="connectOnServer(${index})">Connect</button>
          </div>
          <div class="mini-msg" id="connectMsg-${index}"></div>
          <div id="pairCode-${index}"></div>
        </div>
        <div class="card-mine-header"><div class="dot"></div>Your sessions here</div>
        <div class="card-mine-body">
          <div class="mine-list" id="mineList-${index}"><div class="mine-empty">Loading…</div></div>
        </div>
      </div>
    ` : '';

    return `
      <div class="server-card checking" id="card-${index}">
        <div class="card-top">
          <div>
            <div class="server-name">${server.name}</div>
            <div class="server-url">${server.url.replace('https://', '')}</div>
          </div>
          <div class="status-badge checking" id="badge-${index}">
            <div class="badge-dot"></div>
            <span id="badge-text-${index}">CHECKING</span>
          </div>
        </div>

        <div class="card-stats">
          <div class="stat-row">
            <span class="stat-key">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Uptime
            </span>
            <span class="stat-val loading" id="uptime-${index}"></span>
          </div>
          <div class="stat-row">
            <span class="stat-key">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Sessions
            </span>
            <span class="stat-val loading" id="sessions-${index}"></span>
          </div>
          <div class="stat-row">
            <span class="stat-key">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              Capacity
            </span>
            <span class="stat-val" id="capacity-${index}">—</span>
          </div>
        </div>

        <div class="session-bar-wrap">
          <div class="session-bar-track"><div class="session-bar-fill" id="bar-${index}" style="width:0%"></div></div>
        </div>

        <div class="card-footer">
          <a class="open-btn" href="${server.url}/#token=${encodeURIComponent(authToken || '')}&user=${encodeURIComponent(JSON.stringify(authUser || null))}" target="_blank" rel="noopener">
            Open Panel
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </div>

        ${mineSection}
      </div>
    `;
  }

  function buildAllCards() {
    const container = document.getElementById('cardsContainer');
    const locked = document.getElementById('lockedHero');
    const refreshRow = document.getElementById('refreshRow');
    // Pairing cards are for signed-in users only.
    if (!authToken) {
      container.innerHTML = '';
      container.style.display = 'none';
      locked.style.display = 'block';
      refreshRow.style.display = 'none';
      document.getElementById('adminArea').innerHTML = '';
      return;
    }
    locked.style.display = 'none';
    container.style.display = '';
    refreshRow.style.display = 'flex';
    container.innerHTML = SERVERS.map((s, i) => buildCard(s, i)).join('');
    buildAdminArea();
  }

  // ══════════════════════════ ADMIN DASHBOARD ════════════════════════════
  function isAdmin() { return !!(authUser && (authUser.isAdmin || authUser.is_admin)); }

  function buildAdminArea() {
    const el = document.getElementById('adminArea');
    if (!isAdmin()) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="admin-panel">
        <div class="admin-head"><span>⚙</span> Admin dashboard</div>
        <div class="admin-body">
          <div class="admin-sub">Accounts</div>
          <div id="adminUsers"><div class="admin-empty">Loading…</div></div>
          <div class="admin-sub">All sessions — every server</div>
          <div id="adminSessions"><div class="admin-empty">Loading…</div></div>
        </div>
      </div>
    `;
    loadAdminUsers();
    loadAdminSessions();
  }

  async function loadAdminUsers() {
    const box = document.getElementById('adminUsers');
    if (!box) return;
    try {
      const res = await fetch(AUTH_SERVER + '/api/admin/users', { headers: authHeaders() });
      if (res.status === 401) return handleExpiredAuth();
      const users = (await res.json()).users || [];
      box.innerHTML = users.map(u => `
        <div class="admin-row">
          <b>${escapeHtml(u.username)}</b>
          ${u.is_admin ? '<span class="admin-tag">ADMIN</span>' : ''}
          <span class="grow"><small>${escapeHtml(u.email)}</small></span>
          <small>${u.sessions} session${u.sessions === 1 ? '' : 's'}</small>
          ${String(u.id) === String(authUser.id) ? '' : `
            <button class="admin-btn" onclick="adminSetAdmin(${u.id}, ${!u.is_admin})">${u.is_admin ? 'Demote' : 'Make admin'}</button>
            <button class="admin-btn danger" onclick="adminDelUser(${u.id}, '${escapeHtml(u.username)}')">Delete</button>`}
        </div>`).join('') || '<div class="admin-empty">No accounts yet</div>';
    } catch (e) { box.innerHTML = '<div class="admin-empty">Could not load accounts</div>'; }
  }

  async function loadAdminSessions() {
    const box = document.getElementById('adminSessions');
    if (!box) return;
    const chunks = await Promise.all(SERVERS.map(async (server, i) => {
      try {
        const res = await fetch(server.url + '/api/admin/sessions', { headers: authHeaders(), signal: AbortSignal.timeout(9000) });
        if (!res.ok) throw new Error('bad');
        const rows = (await res.json()).sessions || [];
        const body = rows.length ? rows.map(s => `
          <div class="admin-row">
            <b>${escapeHtml(s.phoneNumber)}</b>
            <span class="grow"><small>${s.owner ? 'owner: ' + escapeHtml(s.owner) : 'unclaimed'}</small></span>
            <small>${formatSessionUptime(s.connectedAt)}</small>
            <button class="admin-btn danger" onclick="deleteOnServer(${i}, '${escapeHtml(s.phoneNumber)}')">Delete</button>
          </div>`).join('') : '<div class="admin-empty">No sessions</div>';
        return `<div class="admin-sub">${escapeHtml(server.name)}</div>${body}`;
      } catch (e) {
        return `<div class="admin-sub">${escapeHtml(server.name)}</div><div class="admin-empty">Server unreachable</div>`;
      }
    }));
    box.innerHTML = chunks.join('');
  }

  async function adminSetAdmin(id, isAdmin) {
    const res = await fetch(AUTH_SERVER + '/api/admin/setadmin', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ id, isAdmin }) });
    const d = await res.json();
    showToast(d.ok ? '✓ Updated' : '✗ ' + (d.error || 'Failed'));
    loadAdminUsers();
  }

  async function adminDelUser(id, name) {
    if (!confirm('Delete account ' + name + '?')) return;
    const res = await fetch(AUTH_SERVER + '/api/admin/deluser', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ id }) });
    const d = await res.json();
    showToast(d.ok ? '🗑 Account deleted' : '✗ ' + (d.error || 'Failed'));
    loadAdminUsers();
  }

  // Public: aggregate uptime/session-count/capacity only. No auth needed.
  async function fetchStatus(server, index) {
    const card = document.getElementById(`card-${index}`);
    if (!card) return; // cards only exist while signed in
    const badge = document.getElementById(`badge-${index}`);
    const badgeTxt = document.getElementById(`badge-text-${index}`);
    const uptimeEl = document.getElementById(`uptime-${index}`);
    const sessEl = document.getElementById(`sessions-${index}`);
    const capEl = document.getElementById(`capacity-${index}`);
    const barEl = document.getElementById(`bar-${index}`);
    if (!card) return;

    try {
      const res = await fetch(server.url + '/api/status', { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const count = data.sessions || 0, max = data.maxSessions || 30, pct = Math.round((count / max) * 100);

      card.className = 'server-card online';
      badge.className = 'status-badge online';
      badgeTxt.textContent = 'ONLINE';
      uptimeEl.className = 'stat-val accent';
      uptimeEl.textContent = formatUptime(data.uptime);
      sessEl.className = 'stat-val';
      sessEl.textContent = count + ' / ' + max;
      capEl.textContent = pct + '%';
      barEl.style.width = pct + '%';
      barEl.className = 'session-bar-fill' + (pct >= 80 ? ' warn' : '');
    } catch (e) {
      card.className = 'server-card offline';
      badge.className = 'status-badge offline';
      badgeTxt.textContent = 'OFFLINE';
      uptimeEl.className = 'stat-val'; uptimeEl.textContent = '—';
      sessEl.className = 'stat-val'; sessEl.textContent = '—';
      capEl.textContent = '—'; barEl.style.width = '0%';
    }
  }

  // Authenticated: only the logged-in user's own sessions on this server.
  async function fetchMySessions(server, index) {
    if (!authToken) return;
    const list = document.getElementById(`mineList-${index}`);
    if (!list) return;
    try {
      const res = await fetch(server.url + '/api/sessions', { headers: authHeaders(), signal: AbortSignal.timeout(8000) });
      if (res.status === 401) return handleExpiredAuth();
      const data = await res.json();
      const sessions = data.sessions || [];
      if (!sessions.length) { list.innerHTML = '<div class="mine-empty">No sessions here yet</div>'; return; }
      list.innerHTML = sessions.map(s => `
        <div class="mine-item">
          <span class="mine-item-num">${escapeHtml(s.phoneNumber)}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);margin-right:.3rem;">${formatSessionUptime(s.connectedAt)}</span>
          <button class="mine-item-del" onclick="deleteOnServer(${index}, '${s.phoneNumber}')">Delete</button>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = '<div class="mine-empty">Could not load</div>';
    }
  }

  async function connectOnServer(index) {
    const server = SERVERS[index];
    const input = document.getElementById(`connectPhone-${index}`);
    const btn = document.getElementById(`connectBtn-${index}`);
    const msg = document.getElementById(`connectMsg-${index}`);
    const codeBox = document.getElementById(`pairCode-${index}`);
    const phone = input.value.trim().replace(/\s+/g, '');

    msg.className = 'mini-msg'; msg.style.display = 'none';
    codeBox.innerHTML = '';

    if (!phone || !/^\d{7,15}$/.test(phone)) {
      msg.textContent = 'Enter a valid number with country code'; msg.className = 'mini-msg err'; return;
    }

    btn.disabled = true; btn.innerHTML = '<div class="spinner-sm"></div>';
    try {
      const res = await fetch(server.url + '/api/connect', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ phone }) });
      if (res.status === 401) { btn.disabled = false; btn.textContent = 'Connect'; return handleExpiredAuth(); }
      const data = await res.json();
      if (data.code) {
        codeBox.innerHTML = `<div class="pair-code-box"><div class="pair-code-val">${escapeHtml(data.code)}</div><div class="pair-code-hint">WhatsApp → Linked Devices → Link with phone number instead</div></div>`;
        msg.textContent = '✓ Code ready — enter it in WhatsApp now'; msg.className = 'mini-msg ok';
        fetchMySessions(server, index);
        fetchStatus(server, index);
      } else {
        msg.textContent = data.error || 'Failed to generate code'; msg.className = 'mini-msg err';
      }
    } catch (e) { msg.textContent = 'Server error'; msg.className = 'mini-msg err'; }
    btn.disabled = false; btn.textContent = 'Connect';
  }

  async function deleteOnServer(index, phone) {
    const server = SERVERS[index];
    if (!confirm(`Disconnect and delete ${phone}?`)) return;
    try {
      const res = await fetch(server.url + '/api/delsession', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ phone }) });
      if (res.status === 401) return handleExpiredAuth();
      const data = await res.json();
      if (data.ok) {
        showToast('🗑 Session deleted');
        fetchMySessions(server, index);
        fetchStatus(server, index);
      } else {
        showToast('✗ ' + (data.error || 'Failed to delete'));
      }
    } catch (e) { showToast('✗ Server error'); }
  }

  function handleExpiredAuth() {
    clearAuth();
    showToast('Session expired — please sign in again');
  }

  async function refreshAll() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    if (!authToken) return; // nothing to refresh until the user signs in
    const tasks = SERVERS.map((s, i) => fetchStatus(s, i));
    if (authToken) tasks.push(...SERVERS.map((s, i) => fetchMySessions(s, i)));
    if (isAdmin()) tasks.push(loadAdminUsers(), loadAdminSessions());
    await Promise.all(tasks);
    btn.classList.remove('spinning');
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ══════════════════════════ MUSIC PLAYER ════════════════════════════════
  const TRACKS = [
    { title: 'Electric Heat', sub: 'Lo-fi Mix', url: 'https://files.catbox.moe/spcwdi.mpeg', emoji: '🎵' },
    { title: 'Wish', sub: 'Central Cee', url: 'https://files.catbox.moe/u5dmj5.mp3', emoji: '🎶' },
    { title: 'Mi Gente', sub: 'Jba Alvin', url: 'https://files.catbox.moe/brb3vq.mp3', emoji: '🎸' },
  ];
  let currentTrack = 0, isPlaying = false;
  const audio = new Audio();
  audio.preload = 'metadata';

  function buildTrackList() {
    document.getElementById('trackList').innerHTML = TRACKS.map((t, i) => `
      <button class="track-pill ${i === 0 ? 'active' : ''}" id="pill-${i}" onclick="selectTrack(${i})">${t.emoji} ${t.title}</button>
    `).join('');
  }
  function selectTrack(index) {
    currentTrack = index;
    const t = TRACKS[index];
    document.getElementById('trackTitle').textContent = t.title;
    document.getElementById('trackSub').textContent = t.sub;
    document.getElementById('playerArt').textContent = t.emoji;
    document.querySelectorAll('.track-pill').forEach((p, i) => p.classList.toggle('active', i === index));
    document.getElementById('musicProgress').style.width = '0%';
    document.getElementById('currentTime').textContent = '0:00';
    document.getElementById('totalTime').textContent = '0:00';
    if (t.url) { audio.src = t.url; if (isPlaying) audio.play().catch(() => {}); } else { audio.src = ''; }
  }
  function togglePlay() {
    const t = TRACKS[currentTrack];
    if (!t.url) return;
    if (!audio.src || audio.src !== t.url) audio.src = t.url;
    if (isPlaying) audio.pause(); else audio.play().catch(() => {});
  }
  function prevTrack() { selectTrack((currentTrack - 1 + TRACKS.length) % TRACKS.length); }
  function nextTrack() { selectTrack((currentTrack + 1) % TRACKS.length); }
  function seekTo(e) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }
  function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  audio.addEventListener('play', () => {
    isPlaying = true;
    document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    document.getElementById('playerArt').classList.add('playing');
    document.getElementById('waveform').classList.add('playing');
    document.getElementById('liveDot').classList.add('active');
  });
  audio.addEventListener('pause', () => {
    isPlaying = false;
    document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    document.getElementById('playerArt').classList.remove('playing');
    document.getElementById('waveform').classList.remove('playing');
    document.getElementById('liveDot').classList.remove('active');
  });
  audio.addEventListener('ended', () => nextTrack());
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    document.getElementById('musicProgress').style.width = (audio.currentTime / audio.duration) * 100 + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => { document.getElementById('totalTime').textContent = formatTime(audio.duration); });

  // ══════════════════════════ INIT ═════════════════════════════════════════
  renderAuthArea();
  buildAllCards();
  buildTrackList();
  selectTrack(0);
  refreshAll();
  setInterval(refreshAll, 30000);
</script>
</body>
</html>
